<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Sankhya Setu</title>
<meta name="description" content="Sankhya Setu reads what your role needs, runs a short quiz to find your gaps, and routes you straight to the right course on iGOT Karmayogi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body data-screen="login">

<div class="bg-glow" aria-hidden="true"></div>

<div id="app">
  <section class="screen active" id="screen-login">
    <div class="wrap">
      <div class="brand">
        <svg class="mark" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="3" fill="none" stroke="#12181F" stroke-width="1.6"/><path d="M5 10.5l3 3 7-7" fill="none" stroke="#D9A62E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        SANKHYA SETU
      </div>
      <h1>Sign in</h1>
      <p class="lede">Takes ten seconds. No forms to fill.</p>

      <div id="mode-choice" class="stack">
        <button class="btn" onclick="startGoogleLogin(this)">
          <svg width="17" height="17" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
        <button class="btn" onclick="showEmailLogin()">Continue with Email</button>
        <button class="btn" onclick="showPhone()">Continue with Mobile Number</button>
      </div>
      <p class="note" style="margin-top:16px;">New here? <a href="#" onclick="goScreen('signup-1'); return false;" style="color:var(--ink); font-weight:700;">Create an account</a></p>

      <div id="mode-email" style="display:none;">
        <div class="field">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" placeholder="you@gov.in" autocomplete="email">
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <div class="pw-wrap">
            <input type="password" id="login-pass" placeholder="Your password" autocomplete="current-password">
            <button type="button" class="pw-toggle mono" onclick="togglePw('login-pass', this)">SHOW</button>
          </div>
          <div class="errmsg" id="login-error"></div>
        </div>
        <div class="stack" style="margin-top:8px;">
          <button class="btn btn-solid" id="login-submit-btn" onclick="loginWithEmail()">Sign in</button>
        </div>
        <p class="note">New here? <a href="#" onclick="goScreen('signup-1'); return false;" style="color:var(--ink); font-weight:700;">Create an account</a></p>
      </div>

      <div id="mode-phone" style="display:none;">
        <div class="field">
          <div class="field-row">
            <span class="cc mono">+91</span>
            <input type="tel" id="phone" placeholder="Mobile number" maxlength="10" oninput="this.value=this.value.replace(/\D/g,'')">
          </div>
        </div>
        <div class="stack">
          <button class="btn btn-solid" onclick="sendOtp()">Send OTP</button>
        </div>

        <div id="otp-block" style="display:none;">
          <div class="otp-row">
            <input type="text" maxlength="1" class="otp" id="otp1" oninput="otpNext(this)">
            <input type="text" maxlength="1" class="otp" id="otp2" oninput="otpNext(this)">
            <input type="text" maxlength="1" class="otp" id="otp3" oninput="otpNext(this)">
            <input type="text" maxlength="1" class="otp" id="otp4" oninput="otpNext(this)">
          </div>
          <div class="stack" style="margin-top:16px;">
            <button class="btn btn-solid" onclick="verifyOtp()">Verify &amp; continue</button>
          </div>
        </div>

        <p class="note">Demo only — no real messages are sent. Any 4 digits work.</p>
        <p class="note">New here? <a href="#" onclick="goScreen('signup-1'); return false;" style="color:var(--ink); font-weight:700;">Create an account</a></p>
      </div>

      <div class="spacer"></div>
      <div id="back-to-choice" style="display:none; text-align:center;">
        <button class="btn-ghost" onclick="showChoice()">&larr; Back</button>
      </div>
    </div>
  </section>
</div>

<div class="profile-fab" id="profileFab" title="Your profile" style="display:none;">
  <span id="fabInitials">--</span>
  <img id="fabImg" style="display:none;" alt="">
</div>

<div class="demo-jump">
  <div class="demo-menu" id="demoMenu">
    <div class="lbl">Jump to screen (demo)</div>
    <button onclick="jump('landing')">0 · Landing</button>
    <button onclick="jump('login')">1 · Login</button>
    <button onclick="jump('signup-1')">1b · Sign up</button>
    <button onclick="jump('role')">2 · Pick role</button>
    <button onclick="jump('upload')">3 · Upload material</button>
    <button onclick="jump('spin')">4 · Scoring</button>
    <button onclick="jump('quiz')">5 · Quiz</button>
    <button onclick="jump('results')">6 · Results</button>
    <button onclick="jump('practice')">7 · Learn</button>
    <button onclick="jump('progress')">8 · Progress</button>
    <button onclick="jump('profile')">9 · Profile</button>
  </div>
  <button onclick="toggleDemoMenu()" aria-label="Jump to screen">::</button>
</div>

<footer class="appfoot"></footer>

<script src="app.js"></script>
</body>
</html>
